[project]
name = "tp-1-anton-dion"
version = "0.1.0"
description = "Client/server with watchdog, named pipes and shared memory (OSPS TP1)"
authors = [
    { name = "Anton Dion", email = "ed.and.ein@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "sysv-ipc>=1.2.0",
]

[project.scripts]
tp-1-anton-dion = "tp_1_Anton_Dion_Arnaud_Wissoqc:main"
tp-1-client = "tp_1_Anton_Dion_Arnaud_Wissoqc.client:main"
tp-1-test = "tp_1_Anton_Dion_Arnaud_Wissoqc.test_exclusion:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tp_1_Anton_Dion_Arnaud_Wissoqc"
